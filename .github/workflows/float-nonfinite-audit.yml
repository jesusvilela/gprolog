name: Non-finite float boundary differential (audit only)

on:
  push:
    branches: ['audit/float-nonfinite-boundary']
    paths:
      - 'tests/float_indexing/nonfinite_matrix.py'
      - '.github/workflows/float-nonfinite-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        abi: [elf64, elf32]
    steps:
      - name: Checkout pinned goal-expansion baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jesusvilela/gprolog
          ref: 12b4284378a59098b9004fe2b454ad9c19536370
          path: baseline
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: candidate
          persist-credentials: false
      - name: Install 32-bit multilib toolchain
        if: matrix.abi == 'elf32'
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-multilib libc6-dev-i386
          printf 'int main(void){return 0;}\n' | gcc -m32 -x c - -o /tmp/gprolog-check-i686
          readelf -h /tmp/gprolog-check-i686 | grep -E 'Class:.*ELF32'
      - name: Build ELF64 historical and candidate compilers
        if: matrix.abi == 'elf64'
        run: |
          for d in baseline candidate; do
            (cd "$d/src" && ./configure --with-install-dir=in-place && make && make install)
          done
      - name: Build i686 historical and candidate compilers
        if: matrix.abi == 'elf32'
        run: |
          for d in baseline candidate; do
            (cd "$d/src" && CC='gcc -m32' CFLAGS='-O3 -fomit-frame-pointer -m32' LDFLAGS='-m32' \
              ./configure --host=i686-pc-linux-gnu --with-install-dir=in-place && make && make install)
          done
      - name: Verify all binaries match ABI
        run: |
          for d in baseline candidate; do
            for binary in gprolog gplc; do
              file "$d/bin/$binary"
              readelf -h "$d/bin/$binary" | grep -E 'Class:.*${{ matrix.abi == 'elf64' && '64' || '32' }}'
            done
          done
      - name: Run predeclared nonfinite matrix
        run: |
          python3 candidate/tests/float_indexing/nonfinite_matrix.py \
            --baseline-bin "$PWD/baseline/bin" --candidate-bin "$PWD/candidate/bin" \
            --baseline-ref "$(git -C baseline rev-parse HEAD)" \
            --candidate-ref "$(git -C candidate rev-parse HEAD)" \
            --output "$PWD/nonfinite-${{ matrix.abi }}.json"
      - name: Upload full observations even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nonfinite-${{ matrix.abi }}
          path: nonfinite-${{ matrix.abi }}.json
          if-no-files-found: warn
          retention-days: 30
