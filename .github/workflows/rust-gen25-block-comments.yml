name: Gen25 nested block comments: native regression + original SWI oracle

on:
  pull_request:
    paths:
      - 'rust/gprolog-native/**'
      - 'tests/rust_block_comments/**'
      - 'docs/RUST_GEN25_*'
      - '.github/workflows/rust-gen25-block-comments.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Parser-only Gen25 regression and exact upstream oracle (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: elf64
            target: x86_64-unknown-linux-gnu
          - abi: elf32
            target: i686-unknown-linux-gnu
    steps:
      - name: Checkout candidate parser-only branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 80
      - name: Assert PR source and source-frozen Gen18 historical baseline
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_HEAD" ]; then
            git fetch --no-tags origin "$PR_HEAD"
            if [ "$(git rev-parse HEAD)" != "$PR_HEAD" ]; then
              test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
              for path in \
                rust/gprolog-native/src/syntax.rs \
                tests/rust_block_comments/verify_original.py \
                docs/RUST_GEN25_BLOCK_COMMENTS_PROTOCOL.md \
                .github/workflows/rust-gen25-block-comments.yml
              do
                test "$(git rev-parse "HEAD:$path")" = "$(git rev-parse "$PR_HEAD:$path")"
              done
            fi
          fi
          git fetch --no-tags origin refs/pull/18/head
          BASE=901c8b58c12fbe8b79f70b0118f951f3ed2fcf21
          REJECTED=c09fff05d9b3dd43fb90014278e3a98d701d3640
          git cat-file -e "${BASE}^{commit}"
          git cat-file -e "${REJECTED}^{commit}"
          git worktree add --detach /tmp/gen25-release "$BASE"
          git worktree add --detach /tmp/gen25-retired "$REJECTED"
          test "$(git -C /tmp/gen25-release rev-parse HEAD)" = "$BASE"
          test "$(git -C /tmp/gen25-retired rev-parse HEAD)" = "$REJECTED"
          test "$(git hash-object tests/rust_upstream_corpus/upstream/likes.pl)" = \
            88f3d2edcb0fb68c99b559676e5982b3780715f6
          test "$(git hash-object tests/rust_upstream_corpus/upstream/README.md)" = \
            fb3850a4dae3c29faea7907d9b3cd48d940fcfaa
      - name: Install pinned Rust and target and external SWI reference only on ELF64
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          timeout 240 rustup toolchain install 1.85.1 --profile minimal
          timeout 120 rustup target add "$TARGET" --toolchain 1.85.1
          rustc +1.85.1 --version
          if [ "$ABI" = elf32 ]; then
            if ! dpkg -s gcc-multilib libc6-dev-i386 >/dev/null 2>&1; then
              sudo timeout 240 apt-get update -qq
              sudo timeout 1200 env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y -o Acquire::Retries=3 --no-install-recommends \
                  gcc-multilib libc6-dev-i386
            fi
            cat > /tmp/gcc-i686 <<'SH'
          #!/bin/sh
          exec gcc -m32 "$@"
          SH
            chmod +x /tmp/gcc-i686
            echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=/tmp/gcc-i686" >> "$GITHUB_ENV"
          else
            if ! command -v swipl >/dev/null 2>&1; then
              sudo timeout 240 apt-get update -qq
              sudo timeout 1200 env DEBIAN_FRONTEND=noninteractive \
                apt-get install -y -o Acquire::Retries=3 --no-install-recommends \
                  swi-prolog-nox
            fi
            swipl --version
          fi
      - name: Run original Rust source parser unit tests and full profiling-feature tests
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=/tmp/gen25-tests-default cargo +1.85.1 test \
            --manifest-path rust/gprolog-native/Cargo.toml \
            --target "$TARGET" --all-targets
          CARGO_TARGET_DIR=/tmp/gen25-tests-feature cargo +1.85.1 test \
            --manifest-path rust/gprolog-native/Cargo.toml \
            --target "$TARGET" --all-targets --features choicepoint-profile
      - name: Build frozen Gen18 and patched Gen25 feature-disabled native releases
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=/tmp/gen25-base-release cargo +1.85.1 build --release \
            --manifest-path /tmp/gen25-release/Cargo.toml --target "$TARGET"
          CARGO_TARGET_DIR=/tmp/gen25-candidate-release cargo +1.85.1 build --release \
            --manifest-path Cargo.toml --target "$TARGET"
          cp "/tmp/gen25-base-release/$TARGET/release/gprolog-rs" /tmp/gen25-gen18-cli
          cp "/tmp/gen25-candidate-release/$TARGET/release/gprolog-rs" /tmp/gen25-new-cli
          for role in gen18 new; do
            if [ "$ABI" = elf32 ]; then
              readelf -h "/tmp/gen25-${role}-cli" | grep -E 'Class:.*ELF32'
            else
              readelf -h "/tmp/gen25-${role}-cli" | grep -E 'Class:.*ELF64'
            fi
            if ldd "/tmp/gen25-${role}-cli" | grep -Ei 'libgprolog|libgprolog_float_decimal'; then
              echo "Historical GNU Prolog C bridge detected unexpectedly" >&2
              exit 1
            fi
          done
      - name: Regression against released Gen18 on 264 already-supported exact outputs
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          python3 /tmp/gen25-retired/tests/rust_two_clause/differential_owned.py \
            --baseline /tmp/gen25-gen18-cli --candidate /tmp/gen25-new-cli \
            --abi "$ABI" --output "$PWD/gen25-historical-$ABI.json"
      - name: Original unmodified upstream source vs live SWI and old normalized derivative
        if: matrix.abi == 'elf64'
        run: |
          set -euo pipefail
          python3 -m py_compile tests/rust_block_comments/verify_original.py
          python3 tests/rust_block_comments/verify_original.py \
            --swi swipl --gen18 /tmp/gen25-gen18-cli \
            --candidate /tmp/gen25-new-cli \
            --output "$PWD/gen25-unmodified-swi-elf64.json"
      - name: Preserve success and failure raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gen25-block-comments-${{ matrix.abi }}
          path: |
            gen25-historical-${{ matrix.abi }}.json
            gen25-unmodified-swi-elf64.json
            docs/RUST_GEN25_BLOCK_COMMENTS_PROTOCOL.md
            tests/rust_block_comments/verify_original.py
            tests/rust_upstream_corpus/upstream/likes.pl
          retention-days: 30
          if-no-files-found: warn
