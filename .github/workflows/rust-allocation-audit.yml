name: Gen20 frozen Gen18-vs-Gen19 allocator trace (no engine edits)

on:
  push:
    branches: ['experiment/rust-continuation-allocation-audit']
    paths:
      - 'tests/rust_allocation/**'
      - '.github/workflows/rust-allocation-audit.yml'
      - 'docs/RUST_NATIVE_ALLOCATION_AUDIT_PROTOCOL.md'
      - 'docs/RUST_NATIVE_ALLOCATION_AUDIT_RESULTS.md'
      - 'docs/RUST_NATIVE_ALLOCATION_AUDIT_MANIFEST.json'
  pull_request:
    paths:
      - 'tests/rust_allocation/**'
      - '.github/workflows/rust-allocation-audit.yml'
      - 'docs/RUST_NATIVE_ALLOCATION_AUDIT_PROTOCOL.md'
      - 'docs/RUST_NATIVE_ALLOCATION_AUDIT_RESULTS.md'
      - 'docs/RUST_NATIVE_ALLOCATION_AUDIT_MANIFEST.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  allocator-audit:
    name: Fixed Gen18 / retired Gen19 allocator probe (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: elf64
            target: x86_64-unknown-linux-gnu
          - abi: elf32
            target: i686-unknown-linux-gnu
    steps:
      - name: Checkout docs and external harness (no engine changes)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 60
      - name: Check source-head tree identity
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_HEAD" ]; then
            git fetch --no-tags origin "$PR_HEAD"
            test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "${PR_HEAD}^{tree}")"
          fi
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Fetch and assert both immutable released and rejected source trees
        run: |
          set -euo pipefail
          GOOD=901c8b58c12fbe8b79f70b0118f951f3ed2fcf21
          BAD=c09fff05d9b3dd43fb90014278e3a98d701d3640
          # PR #18's code remains available even though its performance
          # gates failed and it was correctly closed without merging.
          git fetch --no-tags origin refs/pull/18/head
          git cat-file -e "${GOOD}^{commit}"
          git cat-file -e "${BAD}^{commit}"
          git worktree add --detach /tmp/alloc-gen18 "$GOOD"
          git worktree add --detach /tmp/alloc-gen19 "$BAD"
          test "$(git -C /tmp/alloc-gen18 rev-parse HEAD)" = "$GOOD"
          test "$(git -C /tmp/alloc-gen19 rev-parse HEAD)" = "$BAD"
      - name: Install pinned native Rust and target
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup target add "$TARGET" --toolchain 1.85.1
          rustc +1.85.1 --version
          if [ "$ABI" = elf32 ]; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-multilib libc6-dev-i386
            cat > /tmp/gcc-i686 <<'SH'
          #!/bin/sh
          exec gcc -m32 "$@"
          SH
            chmod +x /tmp/gcc-i686
            echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=/tmp/gcc-i686" >> "$GITHUB_ENV"
          fi
      - name: Verify Gen18 and retired Gen19 with their existing opt-in profile tests
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for gen in 18 19; do
            CARGO_TARGET_DIR="/tmp/alloc-gen${gen}-tests-target" \
            cargo +1.85.1 test --release \
              --manifest-path "/tmp/alloc-gen${gen}/Cargo.toml" \
              --target "$TARGET" --features choicepoint-profile --all-targets
          done
      - name: Build immutable native engines and compile identical external allocator probe
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for gen in 18 19; do
            CARGO_TARGET_DIR="/tmp/alloc-gen${gen}-target" \
            cargo +1.85.1 build --release \
              --manifest-path "/tmp/alloc-gen${gen}/Cargo.toml" \
              --target "$TARGET" --features choicepoint-profile
            d="/tmp/alloc-gen${gen}-target/$TARGET/release/deps"
            shopt -s nullglob
            libs=("$d"/libgprolog_native-*.rlib)
            echo "Found ${#libs[@]} candidate rlibs in $d"
            printf "  %s\n" "${libs[@]}"
            if [ "${#libs[@]}" -ne 1 ]; then
              echo "Expected exactly one Rust feature-enabled release rlib at $d" >&2
              exit 1
            fi
            linker=()
            if [ "$ABI" = elf32 ]; then linker=(-C linker=/tmp/gcc-i686); fi
            rustc +1.85.1 --edition=2021 -C opt-level=3 -C panic=abort \
              --target "$TARGET" "${linker[@]}" \
              -L "dependency=$d" --extern "gprolog_native=${libs[0]}" \
              tests/rust_allocation/alloc_probe.rs \
              -o "/tmp/gen${gen}-alloc-probe"
            cp "/tmp/alloc-gen${gen}-target/$TARGET/release/gprolog-rs" \
              "/tmp/gen${gen}-alloc-cli"
            if [ "$ABI" = elf32 ]; then
              readelf -h "/tmp/gen${gen}-alloc-probe" | grep 'Class:.*ELF32'
            else
              readelf -h "/tmp/gen${gen}-alloc-probe" | grep 'Class:.*ELF64'
            fi
            if ldd "/tmp/gen${gen}-alloc-probe" | grep -Ei 'libgprolog|libgprolog_float_decimal'; then
              echo "Unexpected C GNU Prolog bridge" >&2
              exit 1
            fi
          done
      - name: Recheck frozen 264-case full-output CLI parity
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          python3 /tmp/alloc-gen19/tests/rust_two_clause/differential_owned.py \
            --baseline /tmp/gen18-alloc-cli --candidate /tmp/gen19-alloc-cli \
            --abi "$ABI" --output "$PWD/alloc-semantic-$ABI.json"
      - name: Matched allocator-request and live-counter comparison
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          python3 -m py_compile tests/rust_allocation/compare_allocations.py
          python3 tests/rust_allocation/compare_allocations.py \
            --released /tmp/gen18-alloc-probe --rejected /tmp/gen19-alloc-probe \
            --abi "$ABI" --output "$PWD/alloc-contrast-$ABI.json"
      - name: Upload raw evidence even when a preregistered gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-continuation-alloc-${{ matrix.abi }}
          path: |
            alloc-semantic-${{ matrix.abi }}.json
            alloc-contrast-${{ matrix.abi }}.json
            docs/RUST_NATIVE_ALLOCATION_AUDIT_PROTOCOL.md
          retention-days: 30
          if-no-files-found: warn
