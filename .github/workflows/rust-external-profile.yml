name: Gen21 third-party heap/instruction witness + native timing (frozen engines)

on:
  push:
    branches: ['experiment/rust-independent-heap-instruction']
    paths:
      - 'tests/rust_external_profile/**'
      - 'docs/RUST_GEN21_EXTERNAL_PROFILE_*.md'
      - 'docs/RUST_GEN21_EXTERNAL_PROFILE_*.json'
      - '.github/workflows/rust-external-profile.yml'
  pull_request:
    paths:
      - 'tests/rust_external_profile/**'
      - 'docs/RUST_GEN21_EXTERNAL_PROFILE_*.md'
      - 'docs/RUST_GEN21_EXTERNAL_PROFILE_*.json'
      - '.github/workflows/rust-external-profile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Uninstrumented frozen Gen18/Gen19 native solve (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: elf64
            target: x86_64-unknown-linux-gnu
          - abi: elf32
            target: i686-unknown-linux-gnu
    steps:
      - name: Checkout external harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 80
      - name: Verify PR source tree and freeze source commits
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_HEAD" ]; then
            git fetch --no-tags origin "$PR_HEAD"
            test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "${PR_HEAD}^{tree}")"
          fi
          git fetch --no-tags origin refs/pull/18/head
          BASE=901c8b58c12fbe8b79f70b0118f951f3ed2fcf21
          BAD=c09fff05d9b3dd43fb90014278e3a98d701d3640
          git cat-file -e "${BASE}^{commit}"
          git cat-file -e "${BAD}^{commit}"
          git worktree add --detach /tmp/gen21-native-18 "$BASE"
          git worktree add --detach /tmp/gen21-native-19 "$BAD"
          test "$(git -C /tmp/gen21-native-18 rev-parse HEAD)" = "$BASE"
          test "$(git -C /tmp/gen21-native-19 rev-parse HEAD)" = "$BAD"
          git rev-parse HEAD
      - name: Pinned Rust toolchain and native Linux target
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup target add "$TARGET" --toolchain 1.85.1
          rustc +1.85.1 --version
          if [ "$ABI" = elf32 ]; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-multilib libc6-dev-i386
            cat > /tmp/gcc-i686 <<'SH'
          #!/bin/sh
          exec gcc -m32 "$@"
          SH
            chmod +x /tmp/gcc-i686
            echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=/tmp/gcc-i686" >> "$GITHUB_ENV"
          fi
      - name: Verify feature-disabled frozen Rust subsets
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for gen in 18 19; do
            CARGO_TARGET_DIR="/tmp/gen21-native-${gen}-test-target" \
              cargo +1.85.1 test --manifest-path "/tmp/gen21-native-${gen}/Cargo.toml" \
              --target "$TARGET" --all-targets
          done
      - name: Link identical no-profile external harness to each frozen release library
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          for gen in 18 19; do
            CARGO_TARGET_DIR="/tmp/gen21-native-${gen}-release" \
              cargo +1.85.1 build --release --target "$TARGET" \
              --manifest-path "/tmp/gen21-native-${gen}/Cargo.toml"
            d="/tmp/gen21-native-${gen}-release/$TARGET/release/deps"
            shopt -s nullglob
            libs=("$d"/libgprolog_native-*.rlib)
            test "${#libs[@]}" -eq 1
            linker=()
            if [ "$ABI" = elf32 ]; then linker=(-C linker=/tmp/gcc-i686); fi
            rustc +1.85.1 --edition=2021 -C opt-level=3 -C panic=abort \
              --target "$TARGET" "${linker[@]}" -L "dependency=$d" \
              --extern "gprolog_native=${libs[0]}" \
              tests/rust_choicepoint/bench_continuations.rs \
              -o "/tmp/gen21-native-${gen}-bench"
            cp "/tmp/gen21-native-${gen}-release/$TARGET/release/gprolog-rs" \
              "/tmp/gen21-native-${gen}-cli"
            readelf -h "/tmp/gen21-native-${gen}-bench" | \
              grep "Class:.*ELF$( [ "$ABI" = elf32 ] && echo 32 || echo 64 )"
            if ldd "/tmp/gen21-native-${gen}-bench" | grep -Ei 'libgprolog|libgprolog_float_decimal'; then
              echo "unexpected historical C runtime" >&2
              exit 1
            fi
          done
      - name: Replay independent frozen Rust 264-case full CLI behavioral differential
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          python3 /tmp/gen21-native-19/tests/rust_two_clause/differential_owned.py \
            --baseline /tmp/gen21-native-18-cli \
            --candidate /tmp/gen21-native-19-cli \
            --abi "$ABI" --output "$PWD/gen21-native-semantic-$ABI.json"
      - name: Paired uninstrumented direct-solve timing with controls
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          python3 -m py_compile tests/rust_external_profile/native_timing.py
          python3 tests/rust_external_profile/native_timing.py \
            --gen18 /tmp/gen21-native-18-bench \
            --gen19 /tmp/gen21-native-19-bench \
            --abi "$ABI" --output "$PWD/gen21-native-timing-$ABI.json"
      - name: Retain failed and successful raw evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gen21-native-${{ matrix.abi }}
          path: |
            gen21-native-semantic-${{ matrix.abi }}.json
            gen21-native-timing-${{ matrix.abi }}.json
            docs/RUST_GEN21_EXTERNAL_PROFILE_PROTOCOL.md
          retention-days: 30
          if-no-files-found: warn

  third-party:
    name: External DHAT + Callgrind ELF64 process-wide controls
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout immutable external profiler harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 80
      - name: Freeze release and rejected sources
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_HEAD" ]; then
            git fetch --no-tags origin "$PR_HEAD"
            test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "${PR_HEAD}^{tree}")"
          fi
          git fetch --no-tags origin refs/pull/18/head
          BASE=901c8b58c12fbe8b79f70b0118f951f3ed2fcf21
          BAD=c09fff05d9b3dd43fb90014278e3a98d701d3640
          git cat-file -e "${BASE}^{commit}"
          git cat-file -e "${BAD}^{commit}"
          git worktree add --detach /tmp/gen21-ext-18 "$BASE"
          git worktree add --detach /tmp/gen21-ext-19 "$BAD"
          git rev-parse HEAD
      - name: Install pinned Rust and third-party Valgrind
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup target add x86_64-unknown-linux-gnu --toolchain 1.85.1
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y valgrind
          rustc +1.85.1 --version
          valgrind --version
          uname -a
      - name: Compile identical external Rust process harnesses against frozen feature-disabled libraries
        run: |
          set -euo pipefail
          for gen in 18 19; do
            CARGO_TARGET_DIR="/tmp/gen21-ext-${gen}-release" \
              cargo +1.85.1 build --release \
              --target x86_64-unknown-linux-gnu \
              --manifest-path "/tmp/gen21-ext-${gen}/Cargo.toml"
            d="/tmp/gen21-ext-${gen}-release/x86_64-unknown-linux-gnu/release/deps"
            shopt -s nullglob
            libs=("$d"/libgprolog_native-*.rlib)
            test "${#libs[@]}" -eq 1
            rustc +1.85.1 --edition=2021 -C opt-level=3 -C debuginfo=1 -C panic=abort \
              --target x86_64-unknown-linux-gnu -L "dependency=$d" \
              --extern "gprolog_native=${libs[0]}" \
              tests/rust_external_profile/external_profile.rs \
              -o "/tmp/gen21-ext-${gen}-profile"
            readelf -h "/tmp/gen21-ext-${gen}-profile" | grep "Class:.*ELF64"
            if ldd "/tmp/gen21-ext-${gen}-profile" | grep -Ei 'libgprolog|libgprolog_float_decimal'; then
              echo "unexpected historical C runtime" >&2
              exit 1
            fi
          done
      - name: Reproduce with independent DHAT and Callgrind tools
        run: |
          set -euo pipefail
          python3 -m py_compile tests/rust_external_profile/external_valgrind.py
          python3 tests/rust_external_profile/external_valgrind.py \
            --gen18 /tmp/gen21-ext-18-profile \
            --gen19 /tmp/gen21-ext-19-profile \
            --output "$PWD/gen21-external-elf64.json" \
            --raw-dir "$PWD/gen21-raw-elf64"
      - name: Preserve third-party raw heap and instruction profiles even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gen21-external-valgrind-elf64
          path: |
            gen21-external-elf64.json
            gen21-raw-elf64/**
            docs/RUST_GEN21_EXTERNAL_PROFILE_PROTOCOL.md
          retention-days: 30
          if-no-files-found: warn
