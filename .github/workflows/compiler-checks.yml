name: Compiler checks

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-and-consulted:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and install in place
        working-directory: src
        run: |
          ./configure --with-install-dir=in-place
          # Stage 1: build using the checked-in bootstrap WAM files.
          make
          # Stage 2: regenerate changed compiler modules with stage-1 pl2wam.
          # Git checkout gives source and generated WAM equal timestamps, so
          # relying on timestamps alone silently uses the old compiler.
          touch Pl2Wam/first_arg.pl Pl2Wam/indexing.pl Pl2Wam/wam_emit.pl
          make
          make install
      - name: Goal expansion semantic regressions
        run: python3 tests/goal_expansion/run.py --bin-dir "$PWD/bin"
      - name: Float indexing semantic regressions
        run: python3 tests/float_indexing/run.py --bin-dir "$PWD/bin"
      - name: Native bootstrap and backend checks
        working-directory: src
        run: make check
      - name: Emulated bootstrap
        working-directory: src
        run: make check-e
      - name: Interpreted bootstrap
        working-directory: src
        run: make check-i
      - name: Export verified WAM bootstrap files for synchronization
        run: |
          for stem in first_arg indexing wam_emit; do
            printf 'WAM_BOOTSTRAP_B64_%s=' "$stem"
            base64 -w0 "src/Pl2Wam/$stem.wam"
            printf '\n'
          done
