name: "Gen27 seven licensed original SWI and Scryer programs, live SWI loader"

on:
  pull_request:
    paths:
      - 'tests/rust_cross_origin_corpus/**'
      - 'docs/RUST_GEN27_*'
      - '.github/workflows/rust-gen27-cross-project.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-programs:
    name: Seven immutable SWI-Scryer original programs versus native Rust and SWI
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source, licence records and exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 80
      - name: Verify exact Git source tree and immutable engine baseline commits
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_HEAD" ]; then
            git fetch --no-tags origin "$PR_HEAD"
            if [ "$(git rev-parse HEAD)" = "$PR_HEAD" ]; then
              test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "${PR_HEAD}^{tree}")"
            else
              test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
              for f in \
                tests/rust_cross_origin_corpus/upstream/swi/demo/likes.pl \
                tests/rust_cross_origin_corpus/upstream/swi/demo/README.md \
                tests/rust_cross_origin_corpus/upstream/swi/tests/COPYING \
                tests/rust_cross_origin_corpus/upstream/swi/tests/core_lang/test_list.pl \
                tests/rust_cross_origin_corpus/upstream/swi/tests/core_lang/test_unify.pl \
                tests/rust_cross_origin_corpus/upstream/swi/tests/core_lang/test_bags.pl \
                tests/rust_cross_origin_corpus/upstream/scryer/LICENSE \
                tests/rust_cross_origin_corpus/upstream/scryer/src/examples/least_time.pl \
                tests/rust_cross_origin_corpus/upstream/scryer/src/examples/plres.pl \
                tests/rust_cross_origin_corpus/upstream/scryer/src/examples/echo_server.pl \
                tests/rust_cross_origin_corpus/census.py \
                tests/rust_cross_origin_corpus/test_census.py \
                tests/rust_cross_origin_corpus/validate_gen27.py \
                tests/rust_cross_origin_corpus/results/gen27_source_census.csv \
                docs/RUST_GEN27_CROSS_PROJECT_SOURCE_PROTOCOL.md \
                docs/RUST_GEN27_CROSS_PROJECT_SOURCE_RESULTS.md \
                docs/RUST_GEN27_CROSS_PROJECT_SOURCE_CORRECTIONS.md \
                docs/RUST_GEN27_CROSS_PROJECT_SOURCE_MANIFEST.json \
                .github/workflows/rust-gen27-cross-project.yml
              do
                test "$(git rev-parse "HEAD:$f")" = "$(git rev-parse "$PR_HEAD:$f")"
              done
            fi
          fi
          git fetch --no-tags origin refs/pull/18/head
          OLD18=901c8b58c12fbe8b79f70b0118f951f3ed2fcf21
          OLD19=c09fff05d9b3dd43fb90014278e3a98d701d3640
          GEN24=fb9e05acd87e3fe71052e83ef38f26b9c12701d3
          GEN26=dbaf3af2b417893fcb636f196507aaaab905c286
          for frozen in "$OLD18" "$OLD19" "$GEN24" "$GEN26"; do
            git cat-file -e "${frozen}^{commit}"
          done
          git worktree add --detach /tmp/gen27-rust18 "$OLD18"
          git worktree add --detach /tmp/gen27-rust19 "$OLD19"
          git worktree add --detach /tmp/gen27-rust24 "$GEN24"
          git worktree add --detach /tmp/gen27-rust26 "$GEN26"
      - name: Verify all upstream source blobs and individual rights
        run: |
          set -euo pipefail
          python3 -m py_compile tests/rust_cross_origin_corpus/census.py
          python3 -m py_compile tests/rust_cross_origin_corpus/test_census.py
          python3 tests/rust_cross_origin_corpus/test_census.py
      - name: Install pinned Rust and SWI reference interpreter
        run: |
          set -euo pipefail
          timeout 240 rustup toolchain install 1.85.1 --profile minimal
          timeout 120 rustup target add x86_64-unknown-linux-gnu --toolchain 1.85.1
          if ! command -v swipl >/dev/null 2>&1; then
            sudo timeout 240 apt-get update -qq
            sudo timeout 1200 env DEBIAN_FRONTEND=noninteractive \
              apt-get install -y -o Acquire::Retries=3 --no-install-recommends swi-prolog-nox
          fi
          rustc +1.85.1 --version
          swipl --version
      - name: Compile immutable released Gen18 Gen24 and Gen26 native Rust
        run: |
          set -euo pipefail
          for generation in 18 24 26; do
            CARGO_TARGET_DIR="/tmp/gen27-rust${generation}-target" \
              cargo +1.85.1 build --release --target x86_64-unknown-linux-gnu \
              --manifest-path "/tmp/gen27-rust${generation}/Cargo.toml"
            cp "/tmp/gen27-rust${generation}-target/x86_64-unknown-linux-gnu/release/gprolog-rs" \
              "/tmp/gen27-rust${generation}-cli"
            readelf -h "/tmp/gen27-rust${generation}-cli" | grep -E 'Class:.*ELF64'
            if ldd "/tmp/gen27-rust${generation}-cli" | grep -Ei 'libgprolog|libgprolog_float_decimal'; then
              echo "Historic GNU Prolog C bridge unexpectedly present" >&2
              exit 1
            fi
          done
      - name: Independent twelve-query positive semantic oracle on original likes
        run: |
          set -euo pipefail
          python3 tests/rust_block_comments/verify_original.py \
            --swi swipl --gen18 /tmp/gen27-rust18-cli \
            --candidate /tmp/gen27-rust26-cli \
            --output "$PWD/gen27-likes-original-swi.json"
      - name: Original cross-origin program census with all SWI loader diagnostics
        run: |
          set -euo pipefail
          python3 tests/rust_cross_origin_corpus/census.py \
            --gen24 /tmp/gen27-rust24-cli \
            --gen26 /tmp/gen27-rust26-cli \
            --swi swipl --output "$PWD/gen27-seven-originals.json"
      - name: Historic strict 264-case CLI parity for previously supported programs
        run: |
          set -euo pipefail
          python3 /tmp/gen27-rust19/tests/rust_two_clause/differential_owned.py \
            --baseline /tmp/gen27-rust24-cli \
            --candidate /tmp/gen27-rust26-cli \
            --abi elf64 --output "$PWD/gen27-historical-elf64.json"
      - name: Recompute final-head source licence and independent semantic evidence
        run: |
          set -euo pipefail
          python3 -m py_compile tests/rust_cross_origin_corpus/validate_gen27.py
          python3 tests/rust_cross_origin_corpus/validate_gen27.py \
            --census "$PWD/gen27-seven-originals.json" \
            --oracle "$PWD/gen27-likes-original-swi.json" \
            --historical "$PWD/gen27-historical-elf64.json"
      - name: Save all raw sources, positive and negative observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gen27-seven-licensed-originals
          path: |
            gen27-seven-originals.json
            gen27-likes-original-swi.json
            gen27-historical-elf64.json
            tests/rust_cross_origin_corpus/upstream/
            docs/RUST_GEN27_CROSS_PROJECT_SOURCE_PROTOCOL.md
            docs/RUST_GEN27_CROSS_PROJECT_SOURCE_RESULTS.md
            docs/RUST_GEN27_CROSS_PROJECT_SOURCE_CORRECTIONS.md
            docs/RUST_GEN27_CROSS_PROJECT_SOURCE_MANIFEST.json
            tests/rust_cross_origin_corpus/results/gen27_source_census.csv
          retention-days: 30
          if-no-files-found: warn
