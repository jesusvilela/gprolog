name: Gen19 two-clause ownership - exact Gen18 dual ABI audit

on:
  push:
    branches: ['experiment/rust-two-clause-ownership']
    paths:
      - 'rust/gprolog-native/**'
      - 'tests/rust_choicepoint/**'
      - 'tests/rust_two_clause/**'
      - '.github/workflows/rust-two-clause-ownership.yml'
      - 'docs/RUST_NATIVE_TWO_CLAUSE_OWNERSHIP_PROTOCOL.md'
  pull_request:
    paths:
      - 'rust/gprolog-native/**'
      - 'tests/rust_choicepoint/**'
      - 'tests/rust_two_clause/**'
      - '.github/workflows/rust-two-clause-ownership.yml'
      - 'docs/RUST_NATIVE_TWO_CLAUSE_OWNERSHIP_PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matched:
    name: Frozen Gen18 vs T2-owned (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: elf64
            target: x86_64-unknown-linux-gnu
          - abi: elf32
            target: i686-unknown-linux-gnu
    steps:
      - name: Checkout candidate and locked compiler input
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 60
      - name: Verify checked-out source tree is PR head's tree
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -n "$PR_HEAD" ]; then
            git cat-file -e "${PR_HEAD}^{commit}"
            test "$(git rev-parse HEAD^{tree})" = "$(git rev-parse "${PR_HEAD}^{tree}")"
          fi
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Materialize exact released Generation 18 baseline
        run: |
          set -euo pipefail
          BASE=901c8b58c12fbe8b79f70b0118f951f3ed2fcf21
          git cat-file -e "${BASE}^{commit}"
          git worktree add --detach /tmp/gen18-owned-reference "$BASE"
          test "$(git -C /tmp/gen18-owned-reference rev-parse HEAD)" = "$BASE"
      - name: Install pinned native Rust and target
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup target add "$TARGET" --toolchain 1.85.1
          rustc +1.85.1 --version
          if [ "$ABI" = elf32 ]; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-multilib libc6-dev-i386
            cat > /tmp/gcc-i686 <<'SH'
          #!/bin/sh
          exec gcc -m32 "$@"
          SH
            chmod +x /tmp/gcc-i686
            echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=/tmp/gcc-i686" >> "$GITHUB_ENV"
          fi
      - name: Default uninstrumented Rust tests
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=/tmp/gen19-target cargo +1.85.1 test \
            --manifest-path rust/gprolog-native/Cargo.toml --target "$TARGET" --all-targets
      - name: Exact alternative ownership and feature counter tests
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=/tmp/gen19-prof-target cargo +1.85.1 test \
            --manifest-path rust/gprolog-native/Cargo.toml --target "$TARGET" \
            --features choicepoint-profile --all-targets
      - name: Build Gen18 and Gen19 release Rust-only engines and shared harness
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=/tmp/gen18-owned-target cargo +1.85.1 build \
            --release --target "$TARGET" --manifest-path /tmp/gen18-owned-reference/Cargo.toml
          CARGO_TARGET_DIR=/tmp/gen19-owned-target cargo +1.85.1 build \
            --release --target "$TARGET" --manifest-path Cargo.toml
          for gen in 18 19; do
            dir="/tmp/gen${gen}-owned-target/$TARGET/release/deps"
            shopt -s nullglob
            libs=("$dir"/libgprolog_native-*.rlib)
            if [ "${#libs[@]}" -ne 1 ]; then
              echo "Expected one Rust-only release library in $dir" >&2
              exit 1
            fi
            linker=()
            if [ "$ABI" = elf32 ]; then linker=(-C linker=/tmp/gcc-i686); fi
            rustc +1.85.1 --edition=2021 -C opt-level=3 -C panic=abort \
              --target "$TARGET" "${linker[@]}" \
              -L "dependency=$dir" --extern "gprolog_native=${libs[0]}" \
              tests/rust_choicepoint/bench_continuations.rs \
              -o "/tmp/gen${gen}-owned-bench"
            cp "/tmp/gen${gen}-owned-target/$TARGET/release/gprolog-rs" \
               "/tmp/gen${gen}-owned-cli"
            if [ "$ABI" = elf32 ]; then
              readelf -h "/tmp/gen${gen}-owned-bench" | grep 'Class:.*ELF32'
            else
              readelf -h "/tmp/gen${gen}-owned-bench" | grep 'Class:.*ELF64'
            fi
            if ldd "/tmp/gen${gen}-owned-bench" | grep -Ei 'libgprolog|libgprolog_float_decimal'; then
              echo "Historical C runtime bridge found; unsupported" >&2
              exit 1
            fi
          done
      - name: Complete ordered CLI differential and failure/cut attacks
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          python3 -m py_compile tests/rust_two_clause/differential_owned.py
          python3 tests/rust_two_clause/differential_owned.py \
            --baseline /tmp/gen18-owned-cli --candidate /tmp/gen19-owned-cli \
            --abi "$ABI" --output "$PWD/owned-diff-$ABI.json"
      - name: Matched 13-case performance with adversarial negative controls
        env:
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          python3 -m py_compile tests/rust_two_clause/benchmark.py
          python3 tests/rust_two_clause/benchmark.py \
            --baseline /tmp/gen18-owned-bench --candidate /tmp/gen19-owned-bench \
            --abi "$ABI" --candidate-sha "$(git rev-parse HEAD)" \
            --output "$PWD/owned-ab-$ABI.json"
      - name: Live operation-count expectations on T2 and T3
        env:
          TARGET: ${{ matrix.target }}
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR=/tmp/gen19-prof-target cargo +1.85.1 build \
            --release --manifest-path rust/gprolog-native/Cargo.toml \
            --target "$TARGET" --features choicepoint-profile --bin choicepoint-probe
          python3 tests/rust_choicepoint/profile.py \
            --probe "/tmp/gen19-prof-target/$TARGET/release/choicepoint-probe" \
            --abi "$ABI" --output "$PWD/owned-profile-$ABI.json"
      - name: Preserve raw positives and negatives even if CI fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-two-clause-owned-${{ matrix.abi }}
          path: |
            owned-diff-${{ matrix.abi }}.json
            owned-ab-${{ matrix.abi }}.json
            owned-profile-${{ matrix.abi }}.json
            docs/RUST_NATIVE_TWO_CLAUSE_OWNERSHIP_PROTOCOL.md
          retention-days: 30
          if-no-files-found: warn
