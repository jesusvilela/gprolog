name: Rust choicepoint profile - exact operational counters

on:
  push:
    branches: ['experiment/rust-choicepoint-profile']
    paths:
      - 'rust/gprolog-native/**'
      - 'tests/rust_choicepoint/**'
      - '.github/workflows/rust-choicepoint-profile.yml'
      - 'docs/RUST_NATIVE_CHOICEPOINT_PROFILE_PROTOCOL.md'
  pull_request:
    paths:
      - 'rust/gprolog-native/**'
      - 'tests/rust_choicepoint/**'
      - '.github/workflows/rust-choicepoint-profile.yml'
      - 'docs/RUST_NATIVE_CHOICEPOINT_PROFILE_PROTOCOL.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  counter-gates:
    name: Exact Rust profile counters (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: elf64
            target: x86_64-unknown-linux-gnu
          - abi: elf32
            target: i686-unknown-linux-gnu
    steps:
      - name: Checkout experimental instrumentation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Pinned Rust and real native target
        env:
          ABI: ${{ matrix.abi }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal
          rustup target add "$TARGET" --toolchain 1.85.1
          rustc +1.85.1 --version
          if [ "$ABI" = elf32 ]; then
            sudo apt-get update -qq
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-multilib libc6-dev-i386
            cat > /tmp/gcc-i686 <<'SH'
          #!/bin/sh
          exec gcc -m32 "$@"
          SH
            chmod +x /tmp/gcc-i686
            echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=/tmp/gcc-i686" >> "$GITHUB_ENV"
          fi
      - name: Verify default Rust engine unchanged without profile feature
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo +1.85.1 test --manifest-path rust/gprolog-native/Cargo.toml \
            --target "$TARGET" --all-targets
      - name: Verify feature-gated Rust path and exact analytic counter tests
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo +1.85.1 test --manifest-path rust/gprolog-native/Cargo.toml \
            --target "$TARGET" --features choicepoint-profile --all-targets
      - name: Compile one instrumented Rust-only native diagnostic probe
        env:
          TARGET: ${{ matrix.target }}
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          cargo +1.85.1 build --release --manifest-path rust/gprolog-native/Cargo.toml \
            --target "$TARGET" --features choicepoint-profile --bin choicepoint-probe
          EXE=target/"$TARGET"/release/choicepoint-probe
          readelf -h "$EXE" | grep "Class:.*ELF$( [ "$ABI" = elf32 ] && echo 32 || echo 64 )"
          if ldd "$EXE" | grep -Ei 'libgprolog|libgprolog_float_decimal'; then
            echo "unexpected historical GNU Prolog runtime bridge" >&2
            exit 1
          fi
      - name: Test live counters against frozen operational predictions
        env:
          TARGET: ${{ matrix.target }}
          ABI: ${{ matrix.abi }}
        run: |
          set -euo pipefail
          python3 -m py_compile tests/rust_choicepoint/profile.py
          python3 tests/rust_choicepoint/profile.py \
            --probe target/"$TARGET"/release/choicepoint-probe \
            --abi "$ABI" --output "$PWD/choicepoint-profile-$ABI.json"
      - name: Preserve all raw operation counts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-choicepoint-profile-${{ matrix.abi }}
          path: |
            choicepoint-profile-${{ matrix.abi }}.json
            docs/RUST_NATIVE_CHOICEPOINT_PROFILE_PROTOCOL.md
          retention-days: 30
          if-no-files-found: warn
