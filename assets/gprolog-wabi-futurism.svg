<title id="title">gprolog — the quiet logic</title>
<desc id="desc">Original Wabi-Futurism graphic. On an obsidian field an ivory Prolog search tree unfolds from a query into two branches: a failing direct-parent branch and a vermilion successful ancestral recursion. Minimal editorial typography honours GNU Prolog's native compiler.</desc>
