[package]
name = "gprolog-float-decimal"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Experimental locale-independent binary64 parser for GNU Prolog"
license = "LGPL-3.0-or-later OR GPL-2.0-or-later"

[lib]
name = "gprolog_float_decimal"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "float_probe"
path = "src/bin/float_probe.rs"

[profile.release]
panic = "abort"

[dependencies]
